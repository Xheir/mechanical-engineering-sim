[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanical-engineering-sim"
version = "0.1.0"
description = "Reproducible examples for FEA, planar kinematics, and sheet-metal flat patterns"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-fem==12.0.2",
  "gmsh==4.15.2",
  "meshio==5.3.5",
  "ezdxf==1.4.5",
  "matplotlib==3.11.2",
]

[tool.project.urls]
Repository = "https://github.com/Xheir/mechanical-engineering-sim"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
